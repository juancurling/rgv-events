<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0}
body{width:1640px;height:624px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{width:1640px;height:624px;background:linear-gradient(135deg,#132018 0%,#0f1a14 55%,#0b140f 100%);position:relative;display:flex;align-items:center}
.glow{position:absolute;right:-120px;top:-180px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(76,194,126,.18) 0%,rgba(76,194,126,0) 70%)}
.content{padding-left:110px;z-index:2}
.logo{font-size:120px;font-weight:800;color:#eef5f0;letter-spacing:-3px}
.logo span{color:#4cc27e}
.tagline{margin-top:14px;font-size:40px;color:#9db8a8;font-weight:500}
.free{margin-top:30px;display:inline-block;background:#4cc27e;color:#08130c;font-weight:800;font-size:32px;padding:14px 34px;border-radius:14px}
.cats{position:absolute;right:96px;top:96px;font-size:52px;letter-spacing:26px;z-index:2}
.cities{position:absolute;left:112px;bottom:44px;color:#5d7a69;font-size:24px;letter-spacing:2px;z-index:2}
.stripe{position:absolute;bottom:0;left:0;width:100%;height:10px;background:linear-gradient(90deg,#4cc27e,#e8b64c)}
</style></head>
<body><div class="bg">
<div class="glow"></div>
<div class="content">
  <div class="logo">Events<span>956</span></div>
  <div class="tagline">Everything happening in the Rio Grande Valley — one place.</div>
  <div class="free">100% FREE · POST YOUR EVENT</div>
</div>
<div class="cats">🏃 🎶 🎪 🛍️ 🤝 🌴</div>
<div class="cities">McALLEN · EDINBURG · MISSION · PHARR · WESLACO · HARLINGEN · BROWNSVILLE · SPI &amp; EVERY TOWN IN BETWEEN</div>
<div class="stripe"></div>
</div></body></html>
