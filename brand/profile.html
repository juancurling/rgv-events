<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0}
body{width:1024px;height:1024px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.bg{width:1024px;height:1024px;background:radial-gradient(circle at 50% 38%,#1b2c22 0%,#0f1a14 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.sun{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(76,194,126,.22) 0%,rgba(76,194,126,0) 70%)}
.ev{font-size:118px;font-weight:800;color:#eef5f0;letter-spacing:-2px;line-height:.95;z-index:2}
.num{font-size:300px;font-weight:900;color:#4cc27e;letter-spacing:-8px;line-height:.95;z-index:2;text-shadow:0 8px 60px rgba(76,194,126,.35)}
.palms{z-index:2;margin-top:26px;font-size:64px;letter-spacing:18px}
.tag{z-index:2;margin-top:18px;color:#9db8a8;font-size:34px;letter-spacing:6px;text-transform:uppercase}
</style></head>
<body><div class="bg">
<div class="sun"></div>
<div class="ev">Events</div>
<div class="num">956</div>
<div class="palms">🌴</div>
<div class="tag">RGV Events</div>
</div></body></html>
