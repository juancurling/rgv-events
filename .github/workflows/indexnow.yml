name: IndexNow submit

on:
  push:
    branches: [main]
    paths:
      - sitemap.xml
  workflow_dispatch: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: a5289c4c641bac0ee08a3ee8e3d0c53b
        run: python3 scripts/indexnow_submit.py
