name: GoatCounter signup inspect (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Request password reset
        run: |
          curl -sS -i -X POST https://events956.goatcounter.com/user/request-reset \
            --data-urlencode "email=juan@yourfrontline.com" \
            -o /tmp/resp.html
          cat /tmp/resp.html
