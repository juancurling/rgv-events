name: GoatCounter signup inspect (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify email
        run: |
          curl -sS -i "https://events956.goatcounter.com/user/verify/re4vvdk5c88t18p12097b1irb10zhu8a4wmg3y?email=juan%40yourfrontline.com" -o /tmp/verify.html
          echo "=== verify response ==="
          cat /tmp/verify.html
      - name: Inspect reset-password form
        run: |
          cat > /tmp/parse.py << 'PYEOF'
          import urllib.request, re
          req = urllib.request.Request("https://events956.goatcounter.com/user/reset/d4k6fv6tz4zv7u9qmqr55l0g", headers={"User-Agent": "curl/8"})
          html = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
          for m in re.finditer(r'<form\b[^>]*>', html, re.I):
              print("FORM:", m.group(0))
          for m in re.finditer(r'<input\b[^>]*>', html, re.I | re.S):
              print("INPUT:", re.sub(r'\s+', ' ', m.group(0)))
          PYEOF
          python3 /tmp/parse.py
