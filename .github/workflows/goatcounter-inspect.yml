name: GoatCounter signup inspect (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect /user/new (login) page
        run: |
          curl -sS -i https://events956.goatcounter.com/user/new -o /tmp/new.html
          echo "=== headers + body ==="
          cat /tmp/new.html
