name: GoatCounter signup inspect (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Submit GoatCounter signup
        run: |
          curl -sS -i -c /tmp/cookies.txt \
            -X POST https://www.goatcounter.com/signup \
            --data-urlencode "site_code=events956" \
            --data-urlencode "link_domain=events956.com" \
            --data-urlencode "user_email=juan@yourfrontline.com" \
            --data-urlencode "password=bODuRaVHQ0GqCyO1G2ZR" \
            --data-urlencode "turing_test=" \
            --data-urlencode "timezone=America/Chicago" \
            -o /tmp/resp.html
          echo "=== response body ==="
          cat /tmp/resp.html
