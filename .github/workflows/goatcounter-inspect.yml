name: GoatCounter signup inspect (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect /user/forgot form, then submit it
        run: |
          curl -sS https://events956.goatcounter.com/user/forgot -o /tmp/forgot.html
          echo "=== form ==="
          grep -o '<form[^>]*>\|<input[^>]*>' /tmp/forgot.html
          echo "=== submitting ==="
          curl -sS -i -X POST https://events956.goatcounter.com/user/forgot \
            --data-urlencode "email=juan@yourfrontline.com" \
            -o /tmp/forgot_resp.html
          cat /tmp/forgot_resp.html
