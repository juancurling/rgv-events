name: GoatCounter signup inspect (one-off)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Request fresh password reset
        run: |
          curl -sS -i -X POST https://events956.goatcounter.com/user/request-reset \
            --data-urlencode "email=juan@yourfrontline.com" -o /dev/null -w "http_code=%{http_code}\n"
