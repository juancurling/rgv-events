<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events956 — The Rio Grande Valley's Event Calendar</title>
<meta name="description" content="Every event in the 956 — 5Ks, galas, markets, expos, cycling, city events and more. McAllen, Brownsville, Harlingen, Edinburg, SPI and beyond.">
<style>
  :root{
    --bg:#0f1a14; --panel:#16241c; --card:#1b2c22; --line:#2a4032;
    --text:#eef5f0; --muted:#9db8a8; --accent:#4cc27e; --accent-dark:#2e9e5f;
    --gold:#e8b64c; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  header{padding:44px 0 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#132018,var(--bg))}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:2rem;letter-spacing:-.02em}
  .brand h1 span{color:var(--accent)}
  .tagline{color:var(--muted);margin-top:6px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px;align-items:center}
  .search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-size:1rem;outline:none}
  .search:focus{border-color:var(--accent)}
  select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:.95rem}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 22px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#08130c;font-weight:600}
  .chip.sponsor.active{background:var(--gold);border-color:var(--gold)}

  .month{margin:26px 0 12px;font-size:1.05rem;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card-top{display:flex;gap:14px;align-items:flex-start}
  .datebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:62px}
  .datebox .d{font-size:1.4rem;font-weight:700;line-height:1.1}
  .datebox .m{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .card h3{font-size:1.05rem;line-height:1.3}
  .meta{color:var(--muted);font-size:.88rem}
  .desc{color:var(--muted);font-size:.9rem;flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
  .tag.cat{border-color:var(--accent-dark);color:var(--accent)}
  .tag.sp{border-color:var(--gold);color:var(--gold)}
  .card .cta{margin-top:2px;font-size:.9rem;font-weight:600;text-decoration:none}
  .price{color:var(--text);font-weight:600;font-size:.88rem}

  .empty{color:var(--muted);text-align:center;padding:60px 0}
  footer{margin-top:60px;padding:28px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center}
  @media(max-width:600px){.brand h1{font-size:1.5rem}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>Events<span>956</span></h1></div>
    <p class="tagline">The Rio Grande Valley's event calendar — runs, galas, markets, expos, rides &amp; more.</p>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Search events, venues, cities…">
      <select id="city"><option value="">All cities</option></select>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="app"><p class="empty">Loading events…</p></main>

<footer>
  <div class="wrap">Events956.com · Serving McAllen, Edinburg, Mission, Pharr, Weslaco, Harlingen, Brownsville &amp; South Padre Island · Updated <span id="updated"></span></div>
</footer>

<script>
const CATS = [
  ["all","All"],
  ["run","5K / 10K Runs"],
  ["cycling","Cycling"],
  ["gala","Galas & Banquets"],
  ["market","Markets"],
  ["expo","Expos"],
  ["city","City Events"],
  ["nonprofit","Nonprofit & Community"],
  ["other","Other"]
];
const CATLABEL = Object.fromEntries(CATS);
CATLABEL["community"]="Nonprofit & Community"; CATLABEL["banquet"]="Galas & Banquets";
const state = { cat:"all", q:"", city:"", sponsor:false, events:[] };

async function load(){
  try{
    const res = await fetch("data/events.json");
    const data = await res.json();
    state.events = (data.events||[]).filter(e => new Date(e.end||e.start) >= new Date());
    document.getElementById("updated").textContent = data.updated || "";
    const cities = [...new Set(state.events.map(e=>e.city).filter(Boolean))].sort();
    const sel = document.getElementById("city");
    cities.forEach(c=>{const o=document.createElement("option");o.value=o.textContent=c;sel.appendChild(o);});
    render();
  }catch(err){
    document.getElementById("app").innerHTML = '<p class="empty">Could not load events. Try again later.</p>';
  }
}

function buildChips(){
  const el = document.getElementById("chips");
  el.innerHTML = "";
  CATS.forEach(([key,label])=>{
    const b=document.createElement("button");
    b.className="chip"+(state.cat===key?" active":"");
    b.textContent=label;
    b.onclick=()=>{state.cat=key;render();};
    el.appendChild(b);
  });
  const sp=document.createElement("button");
  sp.className="chip sponsor"+(state.sponsor?" active":"");
  sp.textContent="★ Sponsorship opportunities";
  sp.onclick=()=>{state.sponsor=!state.sponsor;render();};
  el.appendChild(sp);
}

function norm(c){ if(c==="banquet")return "gala"; if(c==="community")return "nonprofit"; return c||"other"; }

function render(){
  buildChips();
  const q = state.q.toLowerCase();
  let list = state.events.filter(e=>{
    if(state.cat!=="all" && norm(e.category)!==state.cat) return false;
    if(state.city && e.city!==state.city) return false;
    if(state.sponsor && !e.sponsorship) return false;
    if(q && ![e.title,e.description,e.venue,e.city].join(" ").toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>new Date(a.start)-new Date(b.start));

  const app=document.getElementById("app");
  if(!list.length){app.innerHTML='<p class="empty">No events match — try clearing filters.</p>';return;}

  const byMonth={};
  list.forEach(e=>{
    const d=new Date(e.start);
    const k=d.toLocaleString("en-US",{month:"long",year:"numeric",timeZone:"America/Chicago"});
    (byMonth[k]=byMonth[k]||[]).push(e);
  });

  app.innerHTML="";
  for(const [month,events] of Object.entries(byMonth)){
    const h=document.createElement("h2");h.className="month";h.textContent=month;app.appendChild(h);
    const grid=document.createElement("div");grid.className="grid";
    events.forEach(e=>grid.appendChild(card(e)));
    app.appendChild(grid);
  }
}

function card(e){
  const d=new Date(e.start);
  const day=d.toLocaleString("en-US",{day:"numeric",timeZone:"America/Chicago"});
  const mon=d.toLocaleString("en-US",{month:"short",timeZone:"America/Chicago"});
  const time=d.toLocaleString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"});
  const el=document.createElement("div");el.className="card";
  el.innerHTML=`
    <div class="card-top">
      <div class="datebox"><div class="d">${day}</div><div class="m">${mon}</div></div>
      <div>
        <h3>${esc(e.title)}</h3>
        <div class="meta">${time} · ${esc(e.venue||"")}${e.city?" · "+esc(e.city):""}</div>
      </div>
    </div>
    <p class="desc">${esc(e.description||"")}</p>
    <div class="tags">
      <span class="tag cat">${esc(CATLABEL[norm(e.category)]||e.category||"Event")}</span>
      ${e.price?`<span class="tag">${esc(e.price)}</span>`:""}
      ${e.sponsorship?`<span class="tag sp">★ Sponsorships available</span>`:""}
    </div>
    ${e.url?`<a class="cta" href="${escAttr(e.url)}" target="_blank" rel="noopener">Details →</a>`:""}
  `;
  return el;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function escAttr(s){return esc(s).replace(/'/g,"&#39;");}

document.getElementById("q").addEventListener("input",ev=>{state.q=ev.target.value;render();});
document.getElementById("city").addEventListener("change",ev=>{state.city=ev.target.value;render();});
load();
</script>
</body>
</html>
